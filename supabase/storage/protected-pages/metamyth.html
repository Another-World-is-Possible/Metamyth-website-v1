<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METAMYTH: A Journey of Transformation</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="metamyth-journey.css">
</head>
<body class="antialiased pb-28 md:pb-0">

    <div id="loading-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); z-index: 1000; display: none; color: white; flex-direction: column; justify-content: center; align-items: center; font-family: 'AngleFairy2024', serif;">
      <div class="text-4xl">Inhale ... and Exhale</div>
      <div class="mt-4 text-gold text-6xl animate-spin">🌀</div>
    </div>

    <div class="flex flex-col md:flex-row md:h-screen">
        <nav id="sidebar" class="hidden md:flex md:flex-col w-full md:w-80 bg-black bg-opacity-20 border-r border-black border-opacity-20 p-4 md:p-6 flex-shrink-0 md:overflow-y-auto">
            <div id="progress-container" class="mb-6">
                <div class="text-xs text-gray-300 mb-2">Progress</div>
                <div class="w-full bg-gray-700 bg-opacity-60 rounded-full h-2 mb-4 border border-gray-600">
                    <div id="progress-bar" class="h-2 rounded-full glow-progress transition-all duration-500" style="width: 0%"></div>
                </div>
                <div class="bg-black bg-opacity-60 rounded-lg border border-teal-400 p-3 glow-indicator">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <div id="current-artifact-icon" class="text-lg mr-2">✨</div>
                            <div>
                                <div id="current-artifact-title" class="text-sm font-semibold text-white">Awaken</div>
                                <div id="current-progress" class="text-xs text-gray-400">1/36 Complete</div>
                            </div>
                        </div>
                        <button id="view-story-btn" class="bg-transparent border border-gold text-gold text-xs py-1 px-2 rounded hover:bg-gold hover:text-black transition-all duration-300 glow-button">
                            📖 Story
                        </button>
                    </div>
                </div>
            </div>
            <div id="nav-container" class="space-y-1"></div>
        </nav>
        <main class="flex-1 p-4 md:p-10 overflow-y-auto">
            <div id="page-top"></div>
            <div id="content-container"></div>
            <footer class="mt-16 border-t border-teal-400/30 pt-12 pb-8 text-center">
                <h3 class="text-2xl text-gold mb-6 font-angle">Another World is Possible</h3>
                <p class="text-lg text-slate-300 mb-8 max-w-xl mx-auto">
                    The world is made of stories, take back your story to change the world.
                </p>
                <p class="text-sm text-slate-400/60">
                    © 2025 Another World is Possible. All rights reserved. | We serve the story, not profit.
                </p>
            </footer>
        </main>
    </div>
    
    <script></script>
    
    <div id="mobile-bottom-bar" class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-black/80 backdrop-blur-sm border-t border-teal-400/30 px-6 py-2">
    </div>

    <div id="mobile-menu-overlay" class="hidden md:hidden fixed inset-0 bg-black bg-opacity-90 z-50 flex flex-col p-4">
    </div>
    
    </body>
</html>
